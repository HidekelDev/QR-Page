<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huascar Matos | Cuenta Banco Popular</title>
<style>
  :root{
    --azul-profundo:#02203c;
    --azul-marino:#04355e;
    --azul-medio:#0a5f8c;
    --azul-cielo:#3fa9d6;
    --espuma:#eaf6fb;
    --dorado:#d4af37;
    --blanco:#ffffff;
    --texto-suave:#c7dbe8;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(63,169,214,0.25), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(212,175,55,0.12), transparent 45%),
      linear-gradient(180deg, var(--azul-profundo) 0%, var(--azul-marino) 55%, var(--azul-medio) 100%);
    position:relative;
    overflow:hidden;
    padding:20px;
  }

  /* Olas decorativas de fondo */
  body::before, body::after{
    content:"";
    position:absolute;
    left:0;
    width:200%;
    height:150px;
    background-repeat:repeat-x;
    opacity:0.15;
  }

  .waves{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    line-height:0;
    z-index:0;
  }
  .waves svg{
    width:100%;
    height:120px;
    display:block;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(10px);
    border:1px solid rgba(212,175,55,0.35);
    border-radius:18px;
    padding:34px 30px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    color:var(--blanco);
  }

  .ancla{
    font-size:38px;
    margin-bottom:8px;
  }

  .card h1{
    font-size:22px;
    letter-spacing:0.5px;
    margin-bottom:4px;
    color:var(--blanco);
  }

  .card .subtitulo{
    font-size:13px;
    color:var(--dorado);
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:26px;
  }

  .banco{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:14px;
    color:var(--texto-suave);
    margin-bottom:18px;
  }

  .banco .linea{
    width:24px;
    height:1px;
    background:var(--dorado);
    opacity:0.6;
  }

  .cuenta-box{
    background:rgba(2,32,60,0.55);
    border:1px solid rgba(63,169,214,0.4);
    border-radius:12px;
    padding:18px 16px;
    margin-bottom:20px;
  }

  .cuenta-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--azul-cielo);
    margin-bottom:8px;
  }

  .cuenta-numero{
    font-size:26px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--espuma);
    font-family:'Consolas', 'Courier New', monospace;
  }

  .titular{
    font-size:16px;
    color:var(--blanco);
    margin-bottom:26px;
  }

  .titular span{
    color:var(--dorado);
    font-weight:600;
  }

  .btn-copiar{
    width:100%;
    padding:14px 0;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg, var(--azul-cielo), var(--azul-medio));
    color:var(--blanco);
    font-size:15px;
    font-weight:600;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .btn-copiar:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(63,169,214,0.4);
  }

  .btn-copiar:active{
    transform:translateY(0);
  }

  .btn-copiar.copiado{
    background:linear-gradient(135deg, #1e8f5f, #146b47);
  }

  .footer-nota{
    margin-top:20px;
    font-size:11px;
    color:var(--texto-suave);
    opacity:0.7;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="ancla">⚓</div>
    <h1>Huascar Matos</h1>
    <div class="subtitulo">Cuenta para transferencia</div>

    <div class="banco">
      <span class="linea"></span>
      <span>Banco Popular Dominicano</span>
      <span class="linea"></span>
    </div>

    <div class="cuenta-box">
      <div class="cuenta-label">Número de cuenta</div>
      <div class="cuenta-numero" id="numeroCuenta">817146384</div>
    </div>

    <div class="titular">Titular: <span>Huascar Matos</span></div>

    <button class="btn-copiar" id="btnCopiar" onclick="copiarCuenta()">
      <span id="iconoBtn">📋</span>
      <span id="textoBtn">Copiar número de cuenta</span>
    </button>

    <div class="footer-nota">Verifica siempre los datos antes de transferir</div>
  </div>

  <div class="waves">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path fill="#0a5f8c" fill-opacity="0.5" d="M0,64L80,58.7C160,53,320,43,480,48C640,53,800,75,960,80C1120,85,1280,75,1360,69.3L1440,64L1440,120L0,120Z"></path>
    </svg>
  </div>

<script>
  function copiarCuenta(){
    const numero = document.getElementById('numeroCuenta').textContent.trim();
    const btn = document.getElementById('btnCopiar');
    const texto = document.getElementById('textoBtn');
    const icono = document.getElementById('iconoBtn');

    navigator.clipboard.writeText(numero).then(() => {
      icono.textContent = '✅';
      texto.textContent = '¡Copiado!';
      btn.classList.add('copiado');

      setTimeout(() => {
        icono.textContent = '📋';
        texto.textContent = 'Copiar número de cuenta';
        btn.classList.remove('copiado');
      }, 2000);
    }).catch(() => {
      // Fallback para navegadores/entornos sin permiso de clipboard API
      const temp = document.createElement('textarea');
      temp.value = numero;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand('copy');
      document.body.removeChild(temp);

      icono.textContent = '✅';
      texto.textContent = '¡Copiado!';
      btn.classList.add('copiado');
      setTimeout(() => {
        icono.textContent = '📋';
        texto.textContent = 'Copiar número de cuenta';
        btn.classList.remove('copiado');
      }, 2000);
    });
  }
</script>

</body>
</html>
